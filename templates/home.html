<!DOCTYPE html>
<html>
<head>
    <title>JSE Portfolio Tracker</title>
</head>
<body>
    <h1>Supported Shares</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>Ticker</th>
            <th>Sector</th>
            <th>Latest Price (R)</th>
            <th>Date</th>
        </tr>
        {% for stock in stocks %}
        <tr>
            <td>{{ stock.ticker }}</td>
            <td>{{ stock.sector }}</td>
            <td>R{{ "%.2f"|format(stock.close_price) }}</td>
            <td>{{ stock.date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
